name: Check maps
on: pull_request
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ModestoHagney/overspray
          path: overspray
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node check.mjs origin/${{ github.base_ref }}
